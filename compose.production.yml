name: cred-cobr

x-app: &app
  build: .
  env_file:
    - .env
  environment: &app-env
    DJANGO_SETTINGS_MODULE: core.settings.prod
    APP_DATABASE_HOST: db
    APP_DATABASE_PORT: "5432"
    APP_DATABASE_NAME: cred_cobr
    APP_DATABASE_USER: cred_cobr
    APP_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_TASK_TIME_LIMIT: "3600"
    CELERY_TASK_SOFT_TIME_LIMIT: "3300"
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cred_cobr
      POSTGRES_USER: cred_cobr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cred_cobr -d cred_cobr"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    <<: *app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    volumes:
      - reports_data:/app/reports
      - media_data:/app/media

  worker:
    <<: *app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A core worker -l INFO
    volumes:
      - reports_data:/app/reports
      - media_data:/app/media
      - backups_data:/app/backups

  beat:
    <<: *app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A core beat -l INFO

  backup:
    image: postgres:16-alpine
    profiles: ["tools"]
    environment:
      PGHOST: db
      PGUSER: cred_cobr
      PGDATABASE: cred_cobr
      PGPASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backups_data:/backups
      - reports_data:/data/reports:ro
      - media_data:/data/media:ro
      - ./deploy/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]

volumes:
  postgres_data:
  redis_data:
  reports_data:
  media_data:
  backups_data:
